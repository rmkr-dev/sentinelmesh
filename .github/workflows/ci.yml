name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/service-ci.yml

  terraform:
    uses: ./.github/workflows/terraform.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/platform
      - name: Helm template
        run: helm template platform helm/platform --namespace observability > /tmp/rendered.yaml && test -s /tmp/rendered.yaml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Documentation links
        run: python3 scripts/validate-docs.py

  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/test_commit_hygiene.py
          python3 scripts/commit-hygiene.py "$BASE" "$HEAD"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          DATABASE_URL: postgres://platform:platform@localhost:5432/platform?sslmode=disable
        run: go test -tags=integration -race -count=1 ./...

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Marker scan
        run: |
          python3 scripts/marker-scan.py
      - name: Static analysis
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.34.0 ./...)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Shell and workflow lint
        run: |
          shellcheck scripts/*.sh
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s -- 1.7.7
          ./actionlint -no-color
      - name: Coverage report
        run: |
          go test -race -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-check.py cover.out | tee -a "$GITHUB_STEP_SUMMARY" || true
