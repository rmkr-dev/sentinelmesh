name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/service-ci.yml

  terraform:
    uses: ./.github/workflows/terraform.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/platform
      - name: Helm template
        run: helm template platform helm/platform --namespace observability > /tmp/rendered.yaml && test -s /tmp/rendered.yaml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation links
        run: python3 scripts/validate-docs.py

  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/test_commit_hygiene.py
          python3 scripts/commit-hygiene.py "$BASE" "$HEAD"
