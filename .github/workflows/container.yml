name: container

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
    outputs:
      digest:
        description: Published image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.ref != '' && inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: echo "image=ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
