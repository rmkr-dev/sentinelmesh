name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  container:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/container.yml
    with:
      push: true
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
