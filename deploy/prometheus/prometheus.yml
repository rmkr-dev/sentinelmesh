global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # The demo records server latency on its own histogram. Drop the
      # otelhttp server series so request counts are not doubled.
      - source_labels: [__name__, otel_scope_name]
        regex: http_server_.*;go\.opentelemetry\.io/contrib/instrumentation/net/http/otelhttp
        action: drop
  - job_name: platform
    metrics_path: /metrics
    static_configs:
      - targets: ["platform:8080"]
