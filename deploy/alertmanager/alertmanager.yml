route:
  receiver: platform
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2h

receivers:
  - name: platform
    webhook_configs:
      - url: http://platform:8080/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook.token
