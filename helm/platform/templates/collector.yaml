{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch: {}
      {{- if .Values.collector.azure.enabled }}
      cumulativetodelta: {}
      {{- end }}
    exporters:
      otlp/jaeger:
        endpoint: {{ .Values.collector.jaegerEndpoint | quote }}
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: {{ .Values.collector.lokiEndpoint | quote }}
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      {{- if .Values.collector.azure.enabled }}
      otlphttp/azuremonitor:
        traces_endpoint: {{ .Values.collector.azure.tracesEndpoint | quote }}
        logs_endpoint: {{ .Values.collector.azure.logsEndpoint | quote }}
        metrics_endpoint: {{ .Values.collector.azure.metricsEndpoint | quote }}
        auth:
          authenticator: azure_auth
      {{- end }}
    {{- if .Values.collector.azure.enabled }}
    extensions:
      azure_auth:
        use_default: true
        scopes: ["https://monitor.azure.com/.default"]
    {{- end }}
    service:
      {{- if .Values.collector.azure.enabled }}
      extensions: [azure_auth]
      {{- end }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger{{- if .Values.collector.azure.enabled }}, otlphttp/azuremonitor{{- end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter{{- if .Values.collector.azure.enabled }}, cumulativetodelta{{- end }}, batch]
          exporters: [prometheus{{- if .Values.collector.azure.enabled }}, otlphttp/azuremonitor{{- end }}]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki{{- if .Values.collector.azure.enabled }}, otlphttp/azuremonitor{{- end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: collector
          image: {{ if .Values.collector.azure.enabled }}{{ .Values.collector.azure.image }}{{ else }}{{ .Values.collector.image }}{{ end }}
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
    - name: metrics
      port: 8889
{{- end }}
