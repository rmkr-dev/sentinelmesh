id: example-high-error-rate
title: Example high error rate
service: checkout-example
trigger:
  signal_types: [slo, alert]
  metric: http_server_error_rate
  threshold: 0.05
steps:
  - id: inspect_recent_deployment
    action: read
    description: Compare the last deployment with the first symptom.
  - id: evaluate_rollback
    action: recommend
    description: Request approval before rolling back.
    remediation: rollback_deployment
